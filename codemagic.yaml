workflows:
  ios-build:
    name: VAS FM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: flutter_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arthiumlabs.vasfm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons

      - name: Install iOS dependencies (CocoaPods)
        script: |
          cd ios
          pod install

      - name: Verify iOS configuration
        script: |
          flutter doctor -v

      - name: Build iOS IPA for App Store
        script: |
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=17

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Uses App Store Connect API key configured in Codemagic Team Settings
        submit_to_app_store: true
        copyright: "© 2026 Media VAS. All rights reserved."

  android-build:
    name: VAS FM Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: flutter_app
    environment:
      flutter: stable
      # Android signing via environment variables (configure in Codemagic UI):
      #   CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_PASSWORD, CM_KEY_ALIAS
      vars:
        CM_KEYSTORE_PATH: /tmp/keystore.jks

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons

      - name: Set up Android keystore
        script: |
          # Decode keystore from Codemagic environment variable (base64 encoded)
          echo $CM_KEYSTORE_BASE64 | base64 --decode > $CM_KEYSTORE_PATH

          # Write key.properties for Gradle to use
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.1.0 \
            --build-number=17

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      # Google Play publishing will be added once Play Console is set up
      # For now, download the AAB from build artifacts
      email:
        recipients:
          - your-email@example.com  # UPDATE WITH YOUR EMAIL
        notify:
          success: true
          failure: true
